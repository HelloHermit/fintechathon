<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="description" content="小安 · 银行 AI 智能体（模拟银行演示，全部数据为模拟）">
  <title>小安 · 模拟银行</title>
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="stylesheet" href="/assets/app/styles.css">
  <script type="module" src="/assets/app/main.js"></script>
</head>
<body>
  <noscript>本页面需要启用 JavaScript。</noscript>
  <div class="stage" id="stage">
    <main class="phone" id="phone" aria-label="模拟手机银行">
      <div class="statusbar" id="statusbar">
        <span class="sb-time" id="sb-time">--:--</span>
        <span class="sb-badge">模拟银行 · 模拟时间</span>
        <span class="sb-icons" aria-hidden="true">
          <svg viewBox="0 0 20 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="2" y="2" width="17" height="8" rx="2"/><rect x="23.5" y="4" width="2" height="4" rx="1"/></svg>
        </span>
      </div>
      <div class="sms-banner" id="sms-banner" role="status" aria-live="polite" hidden></div>
      <div class="screen" id="screen"></div>
      <div class="sheet-layer" id="sheet-layer" hidden></div>
      <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
    </main>
    <aside class="side" id="side" aria-label="演示辅助面板">
      <section class="side-card" id="side-demo"></section>
      <section class="side-card side-trace" id="side-trace"></section>
      <section class="side-card side-sms" id="side-sms"></section>
    </aside>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
